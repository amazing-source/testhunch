name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0 # this action publishes no floating major tag
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      # No backend and no credentials: this checks the configuration, it reaches no account.
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: testhunch
          POSTGRES_PASSWORD: testhunch
          POSTGRES_DB: testhunch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testhunch -d testhunch"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TESTHUNCH_TEST_POSTGRES_URL: postgresql://testhunch:testhunch@localhost:5432/testhunch
      # Fail instead of skipping if the Postgres contract tests cannot run.
      TESTHUNCH_REQUIRE_POSTGRES: "1"
      # The harness's container script, run for real in Docker (tests/test_benchmark_harness.py).
      TESTHUNCH_TEST_DOCKER: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # testhunch diffs each build against the commit before it
      - uses: astral-sh/setup-uv@v10.1.0 # this action publishes no floating major tag
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --all-extras

      # testhunch on its own tests, through its own Action. One job (Python 3.14) owns the history,
      # which lives in the Actions cache between builds: every build restores the latest history
      # saved by a build of main (pull requests can read it), and only builds of main save it.
      - name: Restore testhunch's history of this test suite
        if: matrix.python == '3.14'
        uses: actions/cache/restore@v6
        with:
          path: .testhunch
          key: testhunch-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: testhunch-history-

      - name: Rank the tests before they run (shadow mode records the ranking)
        if: matrix.python == '3.14'
        uses: ./
        with:
          command: prioritize
          # Pull requests diff against their base branch by default; main is one commit per merge.
          base: ${{ github.event_name == 'push' && 'HEAD~1' || '' }}

      - run: uv run pytest --junitxml=reports/junit.xml

      - name: Record the results and report what shadow mode would have missed
        if: ${{ !cancelled() && matrix.python == '3.14' }}
        uses: ./
        with:
          command: ingest
          reports: reports/junit.xml
          base: ${{ github.event_name == 'push' && 'HEAD~1' || '' }}

      - name: Save the history for the next builds
        if: ${{ !cancelled() && matrix.python == '3.14' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: .testhunch
          key: testhunch-history-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: reports-python-${{ matrix.python }}
          path: reports/
          retention-days: 14

  package:
    name: Build and run the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0 # this action publishes no floating major tag
      - run: uv build
      - name: Install the wheel in a clean environment and ingest a real report
        # Outside the checkout, so the installed package (and its bundled migrations) is what runs.
        run: |
          uv venv "${RUNNER_TEMP}/venv"
          uv pip install --python "${RUNNER_TEMP}/venv" dist/*.whl
          cd "$(mktemp -d)"
          git init --quiet
          git -c user.name=ci -c user.email=ci@example.com commit --quiet --allow-empty -m smoke
          testhunch="${RUNNER_TEMP}/venv/bin/testhunch"
          "$testhunch" ingest "${GITHUB_WORKSPACE}/tests/fixtures/junit/nextest.xml" --db sqlite:///smoke.db --repo ci/smoke
          "$testhunch" report --db sqlite:///smoke.db --repo ci/smoke | tee report.txt
          grep -q "shop::tests::flaky_first_attempt" report.txt

  action:
    name: GitHub Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # the action diffs against the pull request's base branch

      - name: Rank tests before any history exists
        id: empty
        uses: ./
        with:
          command: prioritize

      - name: Check the empty ranking is still well-formed
        env:
          RANKING_JSON: ${{ steps.empty.outputs.ranking-json }}
          RANKING_KEYS: ${{ steps.empty.outputs.ranking-keys }}
        run: |
          test "$(cat "$RANKING_JSON")" = "[]"
          test ! -s "$RANKING_KEYS"

      - name: Record a real report
        uses: ./
        with:
          command: ingest
          reports: |
            tests/fixtures/junit/nextest.xml

      - name: Rank tests with that history, recording the ranking (shadow mode)
        id: ranked
        uses: ./
        with:
          command: prioritize
          base: HEAD # no changed files, so the ranking only reflects the recorded failures

      - name: Check the ranking
        env:
          RANKING_JSON: ${{ steps.ranked.outputs.ranking-json }}
          RANKING_KEYS: ${{ steps.ranked.outputs.ranking-keys }}
        run: |
          test "$(head -n 1 "$RANKING_KEYS")" = "shop::tests::fails_on_purpose"
          test "$(wc -l < "$RANKING_KEYS")" -eq 6
          python3 -c 'import json, sys; ranked = json.load(open(sys.argv[1])); assert len(ranked) == 6, ranked' "$RANKING_JSON"

      - name: Prepare another job's report for the same commit
        # The same results in different bytes, so it is a new run rather than a duplicate.
        run: |
          cp tests/fixtures/junit/nextest.xml "$RUNNER_TEMP/nextest-second-job.xml"
          echo '<!-- another job of the same build -->' >> "$RUNNER_TEMP/nextest-second-job.xml"

      - name: Record it, with the shadow report in the job summary
        uses: ./
        with:
          command: ingest
          reports: ${{ runner.temp }}/nextest-second-job.xml

      - name: Check the shadow report
        # The recorded ranking put fails_on_purpose first, so even the top 10% (1 of 6 tests)
        # catches the failing run.
        run: |
          uvx --from . testhunch shadow --format json | tee "$RUNNER_TEMP/shadow.json"
          python3 - "$RUNNER_TEMP/shadow.json" <<'EOF'
          import json, sys
          report = json.load(open(sys.argv[1]))
          assert (report["runs"], report["failing_runs"]) == (1, 1), report
          top = report["budgets"][0]
          assert (top["fraction"], top["caught_runs"], top["tests_run"]) == (0.1, 1, 1), top
          EOF

  docker:
    name: Docker image and compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and start Postgres, migrations and the API
        run: docker compose up --build --detach

      - name: Wait until the API can reach the database
        run: >-
          curl --fail --silent --show-error
          --retry 30 --retry-delay 2 --retry-all-errors
          http://127.0.0.1:8000/readyz

      - name: Upload a report and read it back
        run: |
          curl --fail --silent --show-error \
            -F 'metadata={"repo": "ci/smoke", "commit_sha": "${{ github.sha }}"}' \
            -F 'reports=@tests/fixtures/junit/pytest.xml' \
            http://127.0.0.1:8000/v1/runs
          curl --fail --silent --show-error \
            "http://127.0.0.1:8000/v1/report?repo=ci/smoke" > report.json
          python3 - <<'EOF'
          import json
          report = json.load(open("report.json"))
          assert report["runs"] == 1, report
          assert len(report["failing"]) == 4, report
          print("smoke test passed:", report["runs"], "run,", len(report["failing"]), "failing tests")
          EOF

      - name: Show container logs
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
