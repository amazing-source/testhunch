name: Release

# Push a tag `vX.Y.Z` matching the version in pyproject.toml to publish:
#   - testhunch X.Y.Z on PyPI, through trusted publishing: PyPI trusts this workflow's OIDC
#     identity (repository, release.yml, environment "pypi"), so no token is stored in GitHub
#   - ghcr.io/<owner>/testhunch:X.Y.Z and :X.Y
# Nothing is published if the tag does not match the package version. The version is written in one
# place, pyproject.toml, and a test holds the README's `@vX.Y.Z` examples to it: what the front page
# tells a reader to install has to be the version this workflow would publish.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  dist:
    name: Build the Python package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0 # this action publishes no floating major tag
      - name: Check that the tag matches the package version
        run: |
          version="$(uv version --short)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version ${version} in pyproject.toml"
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: dist
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/testhunch/
    permissions:
      id-token: write # the OIDC token PyPI checks instead of a password
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2

  image:
    name: Publish container image
    needs: dist
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
